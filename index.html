<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>/// GT3 Gen2 Racing Series Standings ///</title>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-image: url("Audi_R8_LMS_GT3_evo_II.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: scroll;
    }

    h1, h2 {
      text-align: center;
    }

    .page {
      min-height: 100vh;
      padding: 30px;
      background: rgba(255, 255, 255, 0.4);
    }

    /* ✅ SCROLL HORIZONTAL CORRECTO */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .section {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    label {
      font-weight: bold;
    }

    select {
      margin-left: 10px;
      padding: 5px;
    }

    /* ===== DESKTOP ONLY ===== */
    @media (min-width: 769px) {
      body {
        background-attachment: fixed;
      }
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .page {
        padding: 10px;
      }

      .section {
        padding: 10px;
        margin-top: 20px;
      }

      h1 {
        font-size: 1.4rem;
      }

      h2 {
        font-size: 1.2rem;
      }

      label,
      select {
        display: block;
        width: 100%;
        margin: 5px 0;
      }
    }
  </style>
</head>

<body>

<div class="page">

<h1>/// GT3 Gen2 Racing Series Standings ///</h1>

<!-- ================= RACES ================= -->
<div class="section">
  <h2>Race Results</h2>
  <label for="raceSelect">Select event:</label>
  <select id="raceSelect"></select>

  <div class="table-wrapper">
    <table id="raceTable" class="display nowrap" style="width:100%">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- ================= CHAMPIONSHIP ================= -->
<div class="section">
  <h2>Championship Standings</h2>

  <div class="table-wrapper">
    <table id="champTable" class="display nowrap" style="width:100%">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
const raceSelect = document.getElementById('raceSelect');
const championshipCSV = 'season_results/championship_GT3_Season_2025.csv';
let raceTable, champTable;

/* ================= LOAD CSV ================= */
function loadCSV(file, tableId, tableVar) {
  Papa.parse(file, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data;
      if (rows.length < 2) return;

      const header = rows[1];
      const dataRows = rows.slice(2);

      const columns = header.map(col => {
        if (col === "Position") {
          return [
            { title: col, data: col },
            { title: col + '_sort', data: col + '_sort', visible: false }
          ];
        }
        return { title: col, data: col };
      }).flat();

      const data = dataRows.map(r => {
        const obj = {};
        header.forEach((col, i) => {
          obj[col] = r[i] || '';
          if (col === "Position") {
            obj[col + '_sort'] = (r[i] && r[i] !== 'DNF') ? parseInt(r[i]) : 999;
          }
        });
        return obj;
      });

      if (tableVar) tableVar.destroy();
      $(`#${tableId} thead`).empty().append('<tr></tr>');
      columns.forEach(col => $(`#${tableId} thead tr`).append(`<th>${col.title}</th>`));

      tableVar = $(`#${tableId}`).DataTable({
        data: data,
        columns: columns,
        paging: true,
        searching: true,
        responsive: true,
        scrollX: true,
        autoWidth: false,
        order: [[columns.findIndex(c => c.data === 'Position_sort'), 'asc']]
      });

      // 🔧 CLAVE: sincroniza cabecera y cuerpo
      tableVar.columns.adjust().responsive.recalc();

      if (tableId === 'raceTable') raceTable = tableVar;
      else champTable = tableVar;
    }
  });
}

/* ================= LOAD RACES FROM JSON ================= */
async function loadRaceList() {
  const response = await fetch('races.json');
  const json = await response.json();

  json.race_results.forEach(file => {
    const opt = document.createElement('option');
    opt.value = file;
    opt.textContent = file.split('/').pop().replace('.csv','');
    raceSelect.appendChild(opt);
  });

  if (raceSelect.options.length > 0) {
    loadCSV(raceSelect.value, 'raceTable', null);
  }
}

/* ================= EVENTS ================= */
raceSelect.addEventListener('change', () =>
  loadCSV(raceSelect.value, 'raceTable', raceTable)
);

/* ================= INIT ================= */
loadRaceList();
loadCSV(championshipCSV, 'champTable', null);
</script>

</body>
</html>
